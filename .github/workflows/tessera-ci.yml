name: TESSERA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tessera-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: distribution (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build isolated wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Inspect artifact ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          forbidden = ("benchmarks/", "tests/", "docs/", "archive/", "examples/", ".github/")
          wheel = glob.glob("dist/*.whl")
          sdist = glob.glob("dist/*.tar.gz")
          assert len(wheel) == len(sdist) == 1

          with zipfile.ZipFile(wheel[0]) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sdist[0]) as archive:
              sdist_names = [name.split("/", 1)[-1] for name in archive.getnames()]

          for label, names in (("wheel", wheel_names), ("sdist", sdist_names)):
              leaked = [name for name in names if name.startswith(forbidden)]
              assert not leaked, f"{label} contains repository-only paths: {leaked}"

          expected_skills = {
              "sk_docker_environment.md",
              "sk_runtime_verification.md",
              "sk_schema_compliance.md",
              "sk_service_lifecycle.md",
              "sk_shell_execution.md",
          }
          wheel_skills = {
              name.rsplit("/", 1)[-1]
              for name in wheel_names
              if name.startswith("tessera/skills_library/")
          }
          assert wheel_skills == expected_skills
          PY

      - name: Install and smoke the built wheel outside the checkout
        shell: bash
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          set -euo pipefail
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          clean_root="$(mktemp -d)"
          python -m venv "$clean_root/venv"
          "$clean_root/venv/bin/python" -m pip install --upgrade pip
          "$clean_root/venv/bin/python" -m pip install "$wheel"
          cd "$clean_root"
          unset PYTHONPATH
          "$clean_root/venv/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.resources
          import importlib.util
          import os
          import pathlib
          import tessera
          from tessera import TesseraEngine

          package_path = pathlib.Path(tessera.__file__).resolve()
          assert "site-packages" in package_path.parts
          assert importlib.metadata.version("tessera") == tessera.__version__ == "3.4.0"
          assert TesseraEngine.__module__ == "tessera.engine"
          for public_name in tessera.__all__:
              assert getattr(tessera, public_name) is not None
          assert importlib.util.find_spec("mcp") is None
          assert importlib.util.find_spec("requests") is None
          assert importlib.util.find_spec("benchmarks") is None
          skills = importlib.resources.files("tessera").joinpath("skills_library")
          assert len(list(skills.glob("sk_*.md"))) == 5
          assert not any(name in os.environ for name in ("OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GEMINI_API_KEY") if os.environ[name])
          print(f"executable={os.sys.executable}")
          print(f"tessera={package_path}")
          print(f"version={tessera.__version__}")
          PY
          "$clean_root/venv/bin/tessera" --help
          corpus="$clean_root/corpus"
          "$clean_root/venv/bin/tessera" write "$corpus" --id project/package-smoke --type factual --episode package-ci --content "The installed TESSERA wheel works outside its checkout." --tags package,smoke --plain
          "$clean_root/venv/bin/tessera" query "$corpus" "what works outside its checkout?" --top-n 1 --plain | grep -q "project/package-smoke"

      - name: Smoke optional MCP artifact surface
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          clean_root="$(mktemp -d)"
          python -m venv "$clean_root/venv"
          "$clean_root/venv/bin/python" -m pip install --upgrade pip
          "$clean_root/venv/bin/python" -m pip install "${wheel}[mcp]"
          cd "$clean_root"
          unset PYTHONPATH
          "$clean_root/venv/bin/python" - <<'PY'
          import importlib.metadata
          import tessera.mcp_server as server

          scripts = {entry.name: entry.value for entry in importlib.metadata.entry_points(group="console_scripts")}
          assert scripts["tessera-mcp"] == "tessera.mcp_server:main"
          assert server.mcp.name == "tessera"
          PY

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install TESSERA and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run full test suite
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: python -m pytest -ra

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TESSERA
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Exercise real CLI offline
        shell: bash
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          set -euo pipefail
          corpus="$(mktemp -d)"
          mkdir -p artifacts

          # Issue #155 onboarding smoke: dry-run and applied JSON share one
          # source-aware plan, and dry-run creates no canonical state.
          init_project="$(mktemp -d)"
          mkdir -p "$init_project/docs"
          printf '# Project\n\nInitialization smoke.\n' > "$init_project/README.md"
          printf '# Guide\n\nSelected source.\n' > "$init_project/docs/guide.md"
          tessera init --project "$init_project" --store memories \
            --sources recommended --non-interactive --dry-run --json \
            > artifacts/init-dry-run.json
          test ! -e "$init_project/.tessera"
          tessera init --project "$init_project" --store memories \
            --sources recommended --non-interactive --json \
            > artifacts/init-applied.json
          INIT_PROJECT="$init_project" python - <<'PY'
          import json
          import os
          from pathlib import Path

          dry = json.loads(Path("artifacts/init-dry-run.json").read_text())
          applied = json.loads(Path("artifacts/init-applied.json").read_text())
          assert dry["applied"] is False
          assert dry["plan"]["sources"]["selected"] == applied["plan"]["sources"]["selected"]
          assert applied["applied"] is True
          assert applied["result"]["source_files_modified"] == 0
          assert (Path(os.environ["INIT_PROJECT"]) / ".tessera" / "config.yaml").is_file()
          PY

          tessera write "$corpus" \
            --id "project/charter" \
            --type factual \
            --episode "ci-purpose" \
            --content "O propósito do projeto é oferecer uma camada de memória auditável para agentes." \
            --tags "project,purpose,charter,memory"

          tessera write "$corpus" \
            --id "project/learning-process" \
            --type procedural_anchor \
            --episode "ci-learning" \
            --content "O projeto aprende registrando evidências verificadas no TESSERA e recuperando memórias relevantes nas execuções seguintes." \
            --tags "project,learning,tessera,evidence"

          tessera index "$corpus"

          # Smoke the real human/scriptable CLI. These assertions deliberately
          # match the current plain-output contract rather than Rich-only labels.
          tessera query "$corpus" "qual o propósito do projeto?" --top-n 2 --plain | tee artifacts/cli-smoke.txt
          tessera query "$corpus" "como o projeto aprende?" --top-n 2 --debug --plain | tee -a artifacts/cli-smoke.txt
          grep -q "project/charter" artifacts/cli-smoke.txt
          grep -q "project/learning-process" artifacts/cli-smoke.txt
          grep -q "raw_pr=" artifacts/cli-smoke.txt

          # Validate the structured engine contract directly. CI must not infer
          # API semantics by scraping human-oriented text.
          TESSERA_SMOKE_CORPUS="$corpus" python - <<'PY'
          import json
          import os
          from pathlib import Path

          from tessera import TesseraEngine

          corpus = os.environ["TESSERA_SMOKE_CORPUS"]
          engine = TesseraEngine(storage_dir=corpus)
          engine.build_index()
          results = engine.retrieve_context("como o projeto aprende?", top_n=2)

          assert isinstance(results, list) and results
          top = results[0]
          assert top["id"] == "project/learning-process"
          assert isinstance(top["score"], (int, float))
          assert top["relevant_evidence"]
          assert top["evidence_info"]["strategy"] == "paragraph_lexical"
          assert top["body"]
          assert "filepath" in top
          assert "related_ids" in top

          explain = top["score_explain"]
          assert explain["raw_pagerank"] > 0
          assert explain["normalized_relations"] >= 0
          assert explain["relations_contribution"] >= 0

          # Recency is disabled in the default scoring weights. Prove the
          # behavior directly even though the legacy debug field currently
          # exposes the raw recency signal under the historical name.
          default_score = top["score"]
          zero_recency = engine.retrieve_context(
              "como o projeto aprende?", top_n=2, weights={"recency": 0.0}
          )[0]["score"]
          enabled_recency = engine.retrieve_context(
              "como o projeto aprende?", top_n=2, weights={"recency": 1.0}
          )[0]["score"]
          assert abs(default_score - zero_recency) < 1e-12
          assert enabled_recency >= zero_recency

          Path("artifacts/structured-smoke.json").write_text(
              json.dumps(results, indent=2, ensure_ascii=False, default=str),
              encoding="utf-8",
          )
          PY

      - name: Upload CLI smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-cli-smoke
          path: |
            artifacts/cli-smoke.txt
            artifacts/init-dry-run.json
            artifacts/init-applied.json
            artifacts/structured-smoke.json
          if-no-files-found: warn

  sanity-eval:
    name: sanity-eval
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TESSERA
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run deterministic retrieval sanity evaluation
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: python benchmarks/sanity/ci_eval.py --output-dir artifacts/sanity

      - name: Publish evaluation summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/sanity/eval-summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("artifacts/sanity/eval-summary.json").read_text())
          print("# TESSERA CI — Sanity Evaluation")
          print()
          print(f"- Dataset: `{data['dataset']}`")
          print(f"- Queries: **{data['queries']}**")
          print(f"- Hit@1: **{data['hit_at_1']:.1%}**")
          print(f"- Hit@3: **{data['hit_at_3']:.1%}**")
          print(f"- Hit@5: **{data['hit_at_5']:.1%}**")
          print(f"- MRR: **{data['mrr']:.3f}**")
          print(f"- Evidence hit rate: **{data['evidence_hit_rate']:.1%}**")
          print(f"- Average retrieval latency: **{data['average_latency_ms']:.2f} ms**")
          print(f"- Average returned context: **{data['average_returned_chars']:.0f} chars**")
          print(f"- Missing-evidence check: **{data['missing_evidence_check']}**")
          PY
          else
            echo "# TESSERA CI — Sanity Evaluation" >> "$GITHUB_STEP_SUMMARY"
            echo "Evaluation did not produce a summary artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanity evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-sanity-eval
          path: artifacts/sanity/
          if-no-files-found: warn
