name: TESSERA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tessera-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install TESSERA and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run full test suite
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: pytest -ra

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TESSERA
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Exercise real CLI offline
        shell: bash
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          set -euo pipefail
          corpus="$(mktemp -d)"
          mkdir -p artifacts

          tessera write "$corpus" \
            --id "lao/charter" \
            --type factual \
            --episode "ci-purpose" \
            --content "O propósito do LAO é funcionar como um runtime de inovação para agentes autônomos." \
            --tags "lao,purpose,charter"

          tessera write "$corpus" \
            --id "lao/learning-process" \
            --type procedural_anchor \
            --episode "ci-learning" \
            --content "O LAO aprende registrando episódios no TESSERA e recuperando memórias nas execuções seguintes." \
            --tags "lao,learning,tessera"

          tessera index "$corpus"

          tessera query "$corpus" "qual o propósito do LAO?" --top-n 2 --plain | tee artifacts/cli-smoke.txt
          tessera query "$corpus" "como o LAO aprende?" --top-n 2 --debug --plain | tee -a artifacts/cli-smoke.txt

          grep -q "lao/charter" artifacts/cli-smoke.txt
          grep -q "lao/learning-process" artifacts/cli-smoke.txt
          grep -q "Relevant evidence" artifacts/cli-smoke.txt
          grep -q "raw pagerank" artifacts/cli-smoke.txt

      - name: Upload CLI smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-cli-smoke
          path: artifacts/cli-smoke.txt
          if-no-files-found: warn

  sanity-eval:
    name: sanity-eval
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TESSERA
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run deterministic retrieval sanity evaluation
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: python benchmarks/sanity/ci_eval.py --output-dir artifacts/sanity

      - name: Publish evaluation summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/sanity/eval-summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("artifacts/sanity/eval-summary.json").read_text())
          print("# TESSERA CI — Sanity Evaluation")
          print()
          print(f"- Dataset: `{data['dataset']}`")
          print(f"- Queries: **{data['queries']}**")
          print(f"- Hit@1: **{data['hit_at_1']:.1%}**")
          print(f"- Hit@3: **{data['hit_at_3']:.1%}**")
          print(f"- Hit@5: **{data['hit_at_5']:.1%}**")
          print(f"- MRR: **{data['mrr']:.3f}**")
          print(f"- Evidence hit rate: **{data['evidence_hit_rate']:.1%}**")
          print(f"- Average retrieval latency: **{data['average_latency_ms']:.2f} ms**")
          print(f"- Average returned context: **{data['average_returned_chars']:.0f} chars**")
          print(f"- Missing-evidence check: **{data['missing_evidence_check']}**")
          PY
          else
            echo "# TESSERA CI — Sanity Evaluation" >> "$GITHUB_STEP_SUMMARY"
            echo "Evaluation did not produce a summary artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanity evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-sanity-eval
          path: artifacts/sanity/
          if-no-files-found: warn
