name: TESSERA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tessera-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install TESSERA and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run full test suite
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: pytest -ra

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TESSERA
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Exercise real CLI offline
        shell: bash
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          set -euo pipefail
          corpus="$(mktemp -d)"
          mkdir -p artifacts

          tessera write "$corpus" \
            --id "project/charter" \
            --type factual \
            --episode "ci-purpose" \
            --content "O propósito do projeto é oferecer uma camada de memória auditável para agentes." \
            --tags "project,purpose,charter,memory"

          tessera write "$corpus" \
            --id "project/learning-process" \
            --type procedural_anchor \
            --episode "ci-learning" \
            --content "O projeto aprende registrando evidências verificadas no TESSERA e recuperando memórias relevantes nas execuções seguintes." \
            --tags "project,learning,tessera,evidence"

          tessera index "$corpus"

          # Smoke the real human/scriptable CLI. These assertions deliberately
          # match the current plain-output contract rather than Rich-only labels.
          tessera query "$corpus" "qual o propósito do projeto?" --top-n 2 --plain | tee artifacts/cli-smoke.txt
          tessera query "$corpus" "como o projeto aprende?" --top-n 2 --debug --plain | tee -a artifacts/cli-smoke.txt
          grep -q "project/charter" artifacts/cli-smoke.txt
          grep -q "project/learning-process" artifacts/cli-smoke.txt
          grep -q "raw_pr=" artifacts/cli-smoke.txt

          # Validate the structured engine contract directly. CI must not infer
          # API semantics by scraping human-oriented text.
          TESSERA_SMOKE_CORPUS="$corpus" python - <<'PY'
          import json
          import os
          from pathlib import Path

          from tessera import TesseraEngine

          corpus = os.environ["TESSERA_SMOKE_CORPUS"]
          engine = TesseraEngine(storage_dir=corpus)
          engine.build_index()
          results = engine.retrieve_context("como o projeto aprende?", top_n=2)

          assert isinstance(results, list) and results
          top = results[0]
          assert top["id"] == "project/learning-process"
          assert isinstance(top["score"], (int, float))
          assert top["relevant_evidence"]
          assert top["evidence_info"]["strategy"] == "paragraph_lexical"
          assert top["body"]
          assert "filepath" in top
          assert "related_ids" in top

          explain = top["score_explain"]
          assert explain["raw_pagerank"] > 0
          assert explain["normalized_relations"] >= 0
          assert explain["relations_contribution"] >= 0

          # Recency is disabled in the default scoring weights. Prove the
          # behavior directly even though the legacy debug field currently
          # exposes the raw recency signal under the historical name.
          default_score = top["score"]
          zero_recency = engine.retrieve_context(
              "como o projeto aprende?", top_n=2, weights={"recency": 0.0}
          )[0]["score"]
          enabled_recency = engine.retrieve_context(
              "como o projeto aprende?", top_n=2, weights={"recency": 1.0}
          )[0]["score"]
          assert abs(default_score - zero_recency) < 1e-12
          assert enabled_recency >= zero_recency

          Path("artifacts/structured-smoke.json").write_text(
              json.dumps(results, indent=2, ensure_ascii=False, default=str),
              encoding="utf-8",
          )
          PY

      - name: Upload CLI smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-cli-smoke
          path: |
            artifacts/cli-smoke.txt
            artifacts/structured-smoke.json
          if-no-files-found: warn

  sanity-eval:
    name: sanity-eval
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TESSERA
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run deterministic retrieval sanity evaluation
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
        run: python benchmarks/sanity/ci_eval.py --output-dir artifacts/sanity

      - name: Publish evaluation summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/sanity/eval-summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("artifacts/sanity/eval-summary.json").read_text())
          print("# TESSERA CI — Sanity Evaluation")
          print()
          print(f"- Dataset: `{data['dataset']}`")
          print(f"- Queries: **{data['queries']}**")
          print(f"- Hit@1: **{data['hit_at_1']:.1%}**")
          print(f"- Hit@3: **{data['hit_at_3']:.1%}**")
          print(f"- Hit@5: **{data['hit_at_5']:.1%}**")
          print(f"- MRR: **{data['mrr']:.3f}**")
          print(f"- Evidence hit rate: **{data['evidence_hit_rate']:.1%}**")
          print(f"- Average retrieval latency: **{data['average_latency_ms']:.2f} ms**")
          print(f"- Average returned context: **{data['average_returned_chars']:.0f} chars**")
          print(f"- Missing-evidence check: **{data['missing_evidence_check']}**")
          PY
          else
            echo "# TESSERA CI — Sanity Evaluation" >> "$GITHUB_STEP_SUMMARY"
            echo "Evaluation did not produce a summary artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanity evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-sanity-eval
          path: artifacts/sanity/
          if-no-files-found: warn
