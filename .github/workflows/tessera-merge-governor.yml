name: TESSERA Merge Governor

# Deterministic readiness only. Never calls a merge/auto-merge API and never
# requires an AI audit, engine availability, or an AI-authored comment.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [TESSERA CI, TESSERA Benchmark Ledger]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to evaluate"
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  # Keep manual and event-driven evaluations serialized for each PR. Ignored
  # title edits must not cancel an in-flight body/candidate evaluation.
  group: tessera-merge-governor-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number || github.run_id }}-${{ github.event.action == 'edited' && github.event.changes.body == null && github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate deterministic merge gates
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0].number != null) &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run always checks out the trusted default branch, never a
      # PR-controlled artifact/ref from the completed workflow.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          number="${EVENT_PR_NUMBER:-${WORKFLOW_PR_NUMBER:-$INPUT_PR_NUMBER}}"
          [[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid PR number" >&2; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Gather current PR and human review state
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          COMPLETED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json headRefOid,isDraft,mergeable,reviewDecision,statusCheckRollup,body,author > pr.json
          head_sha="$(python -c 'import json;print(json.load(open("pr.json"))["headRefOid"])')"
          # An older run must never publish readiness for a newer PR head.
          if [[ -n "$COMPLETED_HEAD" && "$COMPLETED_HEAD" != "$head_sha" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Ignoring completed workflow for a superseded head."
            exit 0
          fi
          gh api graphql --paginate --slurp \
            -f query='query($owner:String!, $name:String!, $number:Int!, $endCursor:String) {
              repository(owner:$owner, name:$name) {
                pullRequest(number:$number) {
                  reviewThreads(first:100, after:$endCursor) {
                    nodes { isResolved }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }' \
            -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$PR_NUMBER" > threads.json
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp > reviews.json
          python - <<'PY'
          import json
          from governance.merge_governor import payload_from_pr
          with open("pr.json", encoding="utf-8") as fh:
              pr = json.load(fh)
          with open("threads.json", encoding="utf-8") as fh:
              threads = json.load(fh)
          with open("reviews.json", encoding="utf-8") as fh:
              reviews = json.load(fh)
          with open("payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload_from_pr(pr, threads, reviews), fh)
          PY
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Evaluate deterministic gates
        id: evaluate
        if: steps.gather.outputs.skip != 'true'
        run: |
          set -euo pipefail
          set +e
          result="$(python -m governance.merge_governor --payload-file payload.json)"
          status=$?
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "$result"

      - name: Publish merge-governor check run
        if: steps.gather.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.gather.outputs.head_sha }}
          RESULT_JSON: ${{ steps.evaluate.outputs.result }}
          STATUS: ${{ steps.evaluate.outputs.status }}
        run: |
          set -euo pipefail
          # Close the gather/publish race: never stamp a new head with old evidence.
          gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,body > current_pr.json
          current_head="$(python -c 'import json;print(json.load(open("current_pr.json"))["headRefOid"])')"
          [[ "$HEAD_SHA" == "$current_head" ]] || { echo "PR head changed; skipping stale result."; exit 0; }
          python - <<'PY'
          import json
          import os
          from governance.merge_governor import GateResult, recheck_benchmark_contract
          data = json.loads(os.environ["RESULT_JSON"])
          with open("pr.json", encoding="utf-8") as fh:
              evaluated = json.load(fh)
          with open("current_pr.json", encoding="utf-8") as fh:
              current = json.load(fh)
          result = recheck_benchmark_contract(GateResult(**data), evaluated.get("body"), current.get("body"))
          with open("publication.json", "w", encoding="utf-8") as fh:
              json.dump(result.to_dict(), fh)
          PY
          conclusion="failure"
          if [[ "$STATUS" == "0" && "$(python -c 'import json;print(json.load(open("publication.json"))["authorized"])')" == 'True' ]]; then
            conclusion="success"
          fi
          summary="$(python - <<'PY'
          import json
          with open("publication.json", encoding="utf-8") as fh:
              data = json.load(fh)
          print("\n".join(f"- {r}" for r in data["reasons"]) or "Deterministic gates and required human review are satisfied.")
          PY
          )"
          gh api "repos/$REPO/check-runs" \
            -f name="tessera-merge-governor" -f head_sha="$HEAD_SHA" \
            -f status="completed" -f conclusion="$conclusion" \
            -f "output[title]=TESSERA Merge Governor: $conclusion" \
            -f "output[summary]=$summary" > /dev/null
