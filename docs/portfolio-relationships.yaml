# This is the audited native projection of the sources named below, not a new
# roadmap. `blocked_by` is canonical; GitHub derives `blocking`. Each
# `relates_to` edge is declared once and the sync tool treats it as undirected.
policy:
  precedence:
    - authoritative_portfolio_routing
    - current_test_card
    - docs_roadmap
    - current_issue_body
    - live_issue_state
    - conservative_fallback
  satisfied_dependencies: >-
    Preserve closed prerequisites when they form a concrete delivery or safety
    chain. Omit broadly repeated, already-universal foundation baselines such as
    #74 and #96 unless the edge still adds unique navigation value.
  active_blocker_override: >-
    An explicit Active blocker or Remaining blocker narrows the native blocker
    set and supersedes an older full prerequisite list.
  split_scope: >-
    A dependency that blocks only a future sub-scope is not projected as a
    native blocker for the whole issue; keep it as an audited lateral edge.
  textual_mentions: >-
    Mentions without an explicit hierarchy, execution dependency, or material
    architectural rationale are intentionally ignored.

