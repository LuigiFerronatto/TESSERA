<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" data-status="current">
  <title>Current Foundation architecture</title>
  <desc>These components exist on the dated baseline. Optional assistance is separate.</desc>
  <rect width="1400" height="540" fill="#ffffff" />
