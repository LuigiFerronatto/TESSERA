  </defs>
  <text x="44" y="53" font-size="32" fill="#142b45" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Current Foundation architecture</text>
  <text x="44" y="89" font-size="18" fill="#516a7e" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">These components exist on the dated baseline. Optional assistance is separate.</text>
  <text x="44" y="489" font-size="18" fill="#23506c" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">CURRENT FOUNDATION: audited canonical baseline</text>
  <text x="44" y="520" font-size="14" fill="#516a7e" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Baseline 20814a47 / 2026-10-02     Sources and limits: docs/ARCHITECTURE_DIAGRAMS.md</text>
  <rect x="44" y="145" width="350" height="110" rx="6" fill="#edf5fb" stroke="#28597a" stroke-width="2" stroke-dasharray="none" />
  <text x="62" y="179" font-size="22" fill="#142b45" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Configuration</text>
  <text x="62" y="211" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Generated store, readable</text>
  <text x="62" y="237" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">sources, derived index</text>
  <rect x="44" y="300" width="350" height="125" rx="6" fill="#edf5fb" stroke="#28597a" stroke-width="2" stroke-dasharray="none" />
  <text x="62" y="334" font-size="22" fill="#142b45" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Source input</text>
  <text x="62" y="366" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Markdown and TXT; canonical</text>
  <text x="62" y="392" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">normalization and segmentation</text>
  <rect x="536" y="190" width="360" height="190" rx="6" fill="#edf5fb" stroke="#28597a" stroke-width="2" stroke-dasharray="none" />
  <text x="554" y="224" font-size="22" fill="#142b45" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Deterministic core</text>
  <text x="554" y="256" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Write gate, incremental graph,</text>
  <text x="554" y="282" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">TF-IDF and structured evidence</text>
  <rect x="1050" y="145" width="305" height="110" rx="6" fill="#edf5fb" stroke="#28597a" stroke-width="2" stroke-dasharray="none" />
  <text x="1068" y="179" font-size="22" fill="#142b45" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Public surfaces</text>
  <text x="1068" y="211" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Python API, CLI and</text>
  <text x="1068" y="237" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">optional stdio MCP</text>
  <rect x="1050" y="300" width="305" height="125" rx="6" fill="#edf5fb" stroke="#28597a" stroke-width="2" stroke-dasharray="none" />
  <text x="1068" y="334" font-size="22" fill="#142b45" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Optional assistance</text>
  <text x="1068" y="366" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Explicit provider,</text>
  <text x="1068" y="392" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">heuristic baseline and</text>
  <text x="1068" y="418" font-size="18" fill="#142b45" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">free-text output</text>
