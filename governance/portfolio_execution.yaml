# Canonical Execution/Queue ordering source for `scripts/sync_project_board.py`.
#
# ARCHITECTURE DECISION (see docs/PROJECT_BOARD_SYNC.md "Sources of truth"):
#
#   Status / Priority / Milestone
#     -> derived from each issue's own "## Portfolio routing" /
#        "## Authoritative portfolio routing" block (issue body is the
#        source of truth), overlaid with live GitHub state (open/closed,
#        linked PR draft/review state).
#
#   Execution (NOW/NEXT/LATER/UNSCHEDULED) / Queue (ordinal position)
#     -> derived from THIS file, not from issue bodies and not by
#        regex-scraping docs/ROADMAP.md prose. Issue bodies do not declare
#        an Execution/Queue value today, and ROADMAP.md's prose is meant for
#        humans, not a parser contract. This file is the single ordering
#        source of truth; docs/ROADMAP.md's "Canonical execution board"
#        section is the human-readable narrative of the same ordering and
#        must be kept consistent with it, but is never machine-parsed.
#
# Do not add an issue to more than one bucket. `queue` is a global ordinal
# (unique across every bucket); omit `queue` for items without a justified
# exact position (they still get Execution, just no ordinal).
#
# `#16` intentionally appears once. Its P0 containment slice is queue 3
# (NOW); the full temporal-supersession slice is a later revisit of the same
# issue, not a second board row. That nuance is recorded in `notes`, not by
# duplicating the issue in the queue.

