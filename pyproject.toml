[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera"
version = "3.4.0"
description = "TESSERA — Temporal Evolving State Synthesis with Explicit Relations and Atomic Memories: a text-first, auditable memory and evidence layer for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TESSERA Contributors" }]
keywords = ["memory", "agents", "rag", "knowledge-graph", "llm", "pagerank", "provenance", "evidence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.23",
    "PyYAML>=6.0",
    "scikit-learn>=1.2",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp>=1.2.0,<2.0.0"]
llm = ["requests>=2.28"]

[project.scripts]
tessera = "tessera.cli:main"
tessera-mcp = "tessera.mcp_server:main"

[project.urls]
Homepage = "https://github.com/LuigiFerronatto/TESSERA"
Repository = "https://github.com/LuigiFerronatto/TESSERA"
Documentation = "https://github.com/LuigiFerronatto/TESSERA/tree/main/docs"
Issues = "https://github.com/LuigiFerronatto/TESSERA/issues"

[tool.setuptools]
packages = ["tessera"]

[tool.setuptools.package-data]
tessera = ["skills_library/*.md"]
